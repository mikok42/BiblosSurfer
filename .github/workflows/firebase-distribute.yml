name: Firebase App Distribution

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FIREBASE_PROJECT: todayinspacehistory-cbff2
  FIREBASE_TESTER_GROUP: qa

jobs:
  test-ios:
    name: Test iOS
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Unit and UI tests
        working-directory: ios
        run: |
          set -euo pipefail
          DEST_ID=$(xcodebuild \
            -project BiblosSurfer.xcodeproj \
            -scheme BiblosSurfer \
            -showdestinations 2>/dev/null | python3 -c '
          import re, sys
          text = sys.stdin.read()
          ids = []
          for block in re.findall(r"\{[^{}]+\}", text):
              if "placeholder" in block.lower():
                  continue
              if "iOS Simulator" not in block:
                  continue
              if "iPhone" not in block:
                  continue
              match = re.search(r"\bid:([^,}]+)", block)
              if match:
                  ids.append(match.group(1).strip())
          print(ids[-1] if ids else "")
          ')
          if [ -z "$DEST_ID" ]; then
            echo "::error::No iPhone simulator destination from xcodebuild -showdestinations"
            xcodebuild -project BiblosSurfer.xcodeproj -scheme BiblosSurfer -showdestinations || true
            xcrun simctl list devices available || true
            exit 1
          fi
          echo "Using simulator id=$DEST_ID"
          xcrun simctl boot "$DEST_ID" || true
          xcodebuild test \
            -project BiblosSurfer.xcodeproj \
            -scheme BiblosSurfer \
            -destination "id=$DEST_ID" \
            -resultBundlePath "$RUNNER_TEMP/BiblosSurfer.xcresult"

      - name: Upload xcresult
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcresult
          path: ${{ runner.temp }}/BiblosSurfer.xcresult
          if-no-files-found: ignore

  ios:
    needs: [test-ios]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Resolve iOS signing mode
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ios/build"
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "IOS_SIGNING=adhoc" >> "$GITHUB_ENV"
          else
            echo "IOS_SIGNING=unsigned" >> "$GITHUB_ENV"
            echo "::notice::No Apple signing secrets. Building an unsigned IPA as a GitHub artifact. Firebase App Distribution rejects unsigned IPAs (no provisioning profile), so the upload is skipped."
          fi

      - name: Require Firebase service account
        if: env.IOS_SIGNING == 'adhoc'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing secret FIREBASE_SERVICE_ACCOUNT (JSON service account with App Distribution access)"
            exit 1
          fi

      - name: Require Apple signing secrets
        if: env.IOS_SIGNING == 'adhoc'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          missing=0
          for name in \
            APP_STORE_CONNECT_API_KEY_ID \
            APP_STORE_CONNECT_API_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY \
            BUILD_CERTIFICATE_BASE64 \
            BUILD_PROVISION_PROFILE_BASE64 \
            P12_PASSWORD \
            KEYCHAIN_PASSWORD
          do
            eval "val=\$$name"
            if [ -z "$val" ]; then
              echo "::error::Missing secret $name (required for signed iOS Ad Hoc distribution)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install signing certificate and provisioning profile
        if: env.IOS_SIGNING == 'adhoc'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive and export signed IPA
        if: env.IOS_SIGNING == 'adhoc'
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc" build
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY" > "$RUNNER_TEMP/asc/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" /dev/stdin <<< "$(security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision")")
          if [ -z "$TEAM_ID" ]; then
            echo "::error::Could not read TeamIdentifier from provisioning profile"
            exit 1
          fi

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF
          sed -i '' 's/^[[:space:]]*//' "$RUNNER_TEMP/ExportOptions.plist"

          xcodebuild \
            -project BiblosSurfer.xcodeproj \
            -scheme BiblosSurfer \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/BiblosSurfer.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            clean archive

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/BiblosSurfer.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/ios/build" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Build unsigned IPA
        if: env.IOS_SIGNING == 'unsigned'
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project BiblosSurfer.xcodeproj \
            -scheme BiblosSurfer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            clean build

          APP=$(find "$RUNNER_TEMP/DerivedData" -path '*/Release-iphoneos/BiblosSurfer.app' -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "::error::Unsigned build succeeded but BiblosSurfer.app was not found"
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/ios/build/BiblosSurfer.ipa" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: ios/build/*.ipa
          if-no-files-found: error

      - name: Skip Firebase upload for unsigned IPA
        if: env.IOS_SIGNING == 'unsigned'
        run: |
          echo "::notice::Unsigned IPA cannot be uploaded to Firebase App Distribution. Download ios-release-ipa from this run's artifacts."

      - name: Install Firebase CLI
        if: env.IOS_SIGNING == 'adhoc'
        run: npm install -g firebase-tools

      - name: Firebase preflight
        if: env.IOS_SIGNING == 'adhoc'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/firebase-preflight.py"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          firebase appdistribution:groups:list --project "$FIREBASE_PROJECT"

      - name: Distribute IPA to Firebase App Distribution
        if: env.IOS_SIGNING == 'adhoc'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/firebase-preflight.py"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          app_id="${FIREBASE_IOS_APP_ID:-}"
          app_id="${app_id//[$'\t\r\n ']}"
          if [ -z "$app_id" ]; then
            echo "::error::Missing secret FIREBASE_IOS_APP_ID"
            exit 1
          fi
          IPA=$(ls ios/build/*.ipa | head -n 1)
          firebase appdistribution:distribute \
            "$IPA" \
            --project "$FIREBASE_PROJECT" \
            --app "$app_id" \
            --groups "$FIREBASE_TESTER_GROUP" \
            --release-notes "CI build ${{ github.sha }}"
